<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Case Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--bd:#e2e7ec;--ac:#0f9d8f;--open:#2f7de1;--prog:#e9a21b;--wait:#8b5cf6;--done:#22a35a;--over:#e5484d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1418;--card:#182028;--tx:#e8edf2;--mu:#8d9aa7;--bd:#27323d}}
:root[data-theme="dark"]{--bg:#0f1418;--card:#182028;--tx:#e8edf2;--mu:#8d9aa7;--bd:#27323d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:90px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
h1{font-size:20px;margin:0}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:12px;min-width:44px;height:44px;font-size:18px;color:var(--tx);margin-left:6px}
main{padding:0 14px;max-width:640px;margin:auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.tile{background:var(--card);border:2px solid transparent;border-radius:14px;padding:10px;text-align:center;box-shadow:0 1px 4px #0001;min-height:64px}
.tile.on{border-color:var(--ac)}
.tile b{display:block;font-size:22px}.tile span{font-size:12px;color:var(--mu)}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:10px 12px;font:inherit}
textarea{min-height:70px}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1;min-width:0}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001;transition:transform .15s}
.card:active{transform:scale(.99)}
.card.over{border-left:5px solid var(--over)}.card.soon{border-left:5px solid var(--prog)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t{font-weight:600}.sm{font-size:12.5px;color:var(--mu)}
.badge{font-size:11.5px;font-weight:600;color:#fff;border-radius:99px;padding:3px 10px;white-space:nowrap}
.bar{height:7px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.tag{display:inline-block;background:var(--bd);border-radius:8px;padding:1px 8px;font-size:12px;margin:2px 4px 0 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;font-size:30px;border:0;box-shadow:0 6px 16px #0004;z-index:5}
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s;max-width:640px;margin:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.btn{min-height:44px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:600;padding:0 16px;font-size:15px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--over)}
label{font-size:12.5px;color:var(--mu);display:block;margin-top:10px}
.step{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:6px 8px;margin:6px 0}
.step .st{font-size:22px;background:none;border:0;min-width:44px;height:44px}
.step.d .x{text-decoration:line-through;color:var(--mu)}.x{flex:1}
.mini{background:none;border:0;font-size:16px;min-width:36px;height:40px;color:var(--mu)}
.log{font-size:12.5px;color:var(--mu);padding:3px 0;border-bottom:1px dashed var(--bd)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
</style></head><body>
<header><h1>📋 HR Cases</h1><div><button class="ib" id="th">🌙</button><button class="ib" id="mn">⋯</button></div></header>
<main>
<div class="tiles" id="tiles"></div>
<input id="q" type="search" placeholder="🔍 Search title, notes, tags">
<div class="row"><select id="fc"></select><select id="fp"></select><select id="so"></select></div>
<div id="list"></div>
</main>
<button class="fab" id="fab" aria-label="Add case">＋</button>
<div class="ov" id="ov"><div class="sheet" id="sh"></div></div>
<script>
let CATD=[["Stamp & Signature",["Files prepared","Stamped","Signed","Returned / filed"]],["Annual Leave (DGMS)",["Form filled","Sent to DGMS","DGMS signed","Entered in AL system","Closed"]],["AL System Deduction",["Signed form received","Deducted in AL system","Confirmed"]],["Contract / Letter",["Drafted","Reviewed","Signed","Sent / filed"]],["Employee Request",[]],["Other",[]]].map(([name,steps])=>({name,steps}));
let CATS=[],TPL={};
function fillC(){const f=$("#fc");if(f){const v=f.value;f.innerHTML='<option value="">All categories</option>'+CATS.map(c=>`<option>${esc(c)}</option>`).join("");f.value=CATS.includes(v)?v:""}}
function setCats(l){CATD=l;CATS=l.map(x=>x.name);TPL=Object.fromEntries(l.map(x=>[x.name,x.steps]));try{localStorage.setItem("hrcats",JSON.stringify(l))}catch(e){}fillC()}
function loadC(){try{const x=JSON.parse(localStorage.getItem("hrcats"));if(Array.isArray(x)&&x.length)CATD=x}catch(e){}setCats(CATD)}
const PRI=["Low","Medium","High","Urgent"];
const ST={open:["Open","var(--open)"],prog:["In Progress","var(--prog)"],wait:["Waiting","var(--wait)"],done:["Closed","var(--done)"]};
const ICON=["⬜","🟡","✅"];
let cases=[],theme=null,F={st:"",q:""},draft=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toISOString();
const fmt=d=>d?new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"2-digit"}):"";
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function load(){try{cases=JSON.parse(localStorage.getItem("hrcases")||"[]");theme=localStorage.getItem("hrtheme")}catch(e){cases=[]}}
function save(){try{localStorage.setItem("hrcases",JSON.stringify(cases))}catch(e){}}
function setTheme(t){theme=t;document.documentElement.dataset.theme=t;try{localStorage.setItem("hrtheme",t)}catch(e){}}
const prog=c=>c.steps.length?Math.round(c.steps.filter(s=>s.s==2).length/c.steps.length*100):0;
function status(c){const p=prog(c);if(c.steps.length&&p==100)return"done";if(c.waiting)return"wait";if(p==0&&!c.steps.some(s=>s.s==1))return"open";return"prog"}
function due(c){if(!c.due||status(c)=="done")return"";const d=days(today(),c.due);return d<0?"over":d<=2?"soon":""}
function log(c,m){c.log.push({t:now(),m});c.updated=now()}
function sync(c){const was=c.closedAt,d=status(c)=="done";if(d&&!was){c.closedAt=now();log(c,"Case closed ✅")}else if(!d&&was){c.closedAt=null;log(c,"Case reopened")}}
function fill(){
 fillC();
 $("#fp").innerHTML='<option value="">Any priority</option>'+PRI.map(c=>`<option>${c}</option>`).join("");
 $("#so").innerHTML='<option value="due">Sort: Due date</option><option value="pri">Sort: Priority</option><option value="upd">Sort: Updated</option>';
}
function render(){
 const cnt={open:0,prog:0,wait:0,done:0,over:0};
 cases.forEach(c=>{cnt[status(c)]++;if(due(c)=="over")cnt.over++});
 const T=[["open","Open"],["prog","In Progress"],["wait","Waiting"],["done","Closed"],["over","Overdue"]];
 $("#tiles").innerHTML=T.map(([k,l])=>`<button class="tile ${F.st==k?"on":""}" data-k="${k}" style="${k=="over"?"color:var(--over)":""}"><b>${cnt[k]}</b><span>${l}</span></button>`).join("")+`<button class="tile ${F.st==""?"on":""}" data-k=""><b>${cases.length}</b><span>All</span></button>`;
 const q=$("#q").value.toLowerCase(),fc=$("#fc").value,fp=$("#fp").value,so=$("#so").value;
 let L=cases.filter(c=>(!F.st||(F.st=="over"?due(c)=="over":status(c)==F.st))&&(!fc||c.cat==fc)&&(!fp||c.pri==fp)&&(!F.st&&true)||false);
 L=cases.filter(c=>(!F.st||(F.st=="over"?due(c)=="over":status(c)==F.st))&&(!fc||c.cat==fc)&&(!fp||c.pri==fp)&&(!q||(c.title+c.desc+c.tags.join(" ")).toLowerCase().includes(q)));
 if(!F.st)L=L.filter(c=>status(c)!="done"||true);
 L.sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(so=="pri"?PRI.indexOf(b.pri)-PRI.indexOf(a.pri):so=="upd"?b.updated.localeCompare(a.updated):(a.due||"9999").localeCompare(b.due||"9999")));
 $("#list").innerHTML=L.length?L.map(c=>{const s=status(c),p=prog(c),d=due(c),cur=c.steps.find(x=>x.s!=2);
 return `<div class="card ${d}" data-id="${c.id}"><div class="top"><div><div class="t">${c.pin?"📌 ":""}${esc(c.title)}</div><div class="sm">${esc(c.cat)} · ${c.pri}</div></div><span class="badge" style="background:${ST[s][1]}">${ST[s][0]}</span></div>
 <div class="bar"><i style="width:${p}%"></i></div><div class="sm">${p}% · ${s!="done"&&cur?"Next: "+esc(cur.t):"Done"}</div>
 ${c.due?`<div class="sm" style="${d=="over"?"color:var(--over);font-weight:600":d=="soon"?"color:var(--prog);font-weight:600":""}">${d=="over"?"⚠ Overdue · ":d=="soon"?"⏰ Due soon · ":"Due "}${fmt(c.due)}</div>`:""}
 <div>${c.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div></div>`}).join(""):`<div class="empty">No cases here.<br>Tap ＋ to add one.</div>`;
}
function open(html){$("#sh").innerHTML=html;$("#ov").classList.add("show")}
function close(){$("#ov").classList.remove("show");draft=null}
function detail(id){
 const c=cases.find(x=>x.id==id);if(!c)return;const s=status(c);
 open(`<div class="top"><div><div class="t" style="font-size:18px">${esc(c.title)}</div><div class="sm">${esc(c.cat)} · ${c.pri} · opened ${fmt(c.opened)}${c.due?" · due "+fmt(c.due):""}</div></div><span class="badge" style="background:${ST[s][1]}">${ST[s][0]}</span></div>
 <div class="bar"><i style="width:${prog(c)}%"></i></div>
 ${c.desc?`<p>${esc(c.desc)}</p>`:""}<div>${c.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>
 <label>Steps — tap the icon to change status</label>
 ${c.steps.map((x,i)=>`<div class="step ${x.s==2?"d":""}"><button class="st" data-a="cyc" data-i="${i}">${ICON[x.s]}</button><span class="x">${esc(x.t)}</span></div>`).join("")||'<div class="sm">No steps. Tap Edit to add some.</div>'}
 <div class="row"><button class="btn g" data-a="wait">${c.waiting?"▶ Resume":"⏸ Mark waiting"}</button><button class="btn g" data-a="pin">${c.pin?"Unpin":"📌 Pin"}</button></div>
 <label>Activity</label>${c.log.slice().reverse().map(l=>`<div class="log">${new Date(l.t).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} — ${esc(l.m)}</div>`).join("")}
 <div class="row" style="margin-top:16px"><button class="btn" data-a="edit">Edit</button><button class="btn r" data-a="del">Delete</button><button class="btn g" data-a="x">Close</button></div>`);
 $("#sh").dataset.id=id;
}
function form(c){
 draft=c?JSON.parse(JSON.stringify(c)):{id:null,title:"",cat:CATS[0],desc:"",pri:"Medium",opened:today(),due:"",steps:[],tags:[],pin:false,waiting:false,log:[],updated:now()};
 if(!c)draft.steps=(TPL[draft.cat]||[]).map(t=>({t,s:0}));
 drawForm();
}
function drawForm(){
 const d=draft;
 open(`<div class="t" style="font-size:18px">${d.id?"Edit case":"New case"}</div>
 <label>Title</label><input id="f_t" value="${esc(d.title)}" placeholder="e.g. Ahmed's annual leave form">
 <div class="row"><div><label>Category</label><select id="f_c">${(CATS.includes(d.cat)?CATS:[...CATS,d.cat]).map(x=>`<option ${x==d.cat?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
 <div><label>Priority</label><select id="f_p">${PRI.map(x=>`<option ${x==d.pri?"selected":""}>${x}</option>`).join("")}</select></div></div>
 <div class="row"><div><label>Opened</label><input type="date" id="f_o" value="${d.opened}"></div><div><label>Due (optional)</label><input type="date" id="f_d" value="${d.due}"></div></div>
 <label>Notes</label><textarea id="f_n">${esc(d.desc)}</textarea>
 <label>Tags (comma separated)</label><input id="f_g" value="${esc(d.tags.join(", "))}">
 <label>Steps</label><div id="steps">${d.steps.map((x,i)=>`<div class="step"><input data-i="${i}" class="si" value="${esc(x.t)}"><button class="mini" data-a="up" data-i="${i}">▲</button><button class="mini" data-a="dn" data-i="${i}">▼</button><button class="mini" data-a="rm" data-i="${i}">✕</button></div>`).join("")}</div>
 <div class="row"><input id="ns" placeholder="Add a step…"><button class="btn g" data-a="add" style="flex:0 0 80px">Add</button></div>
 <div class="row" style="margin-top:14px"><button class="btn" data-a="save">Save</button><button class="btn g" data-a="x">Cancel</button></div>`);
}
function pull(){
 const d=draft;d.title=$("#f_t").value.trim();d.cat=$("#f_c").value;d.pri=$("#f_p").value;d.opened=$("#f_o").value||today();d.due=$("#f_d").value;d.desc=$("#f_n").value;
 d.tags=$("#f_g").value.split(",").map(x=>x.trim().replace(/^#/,"")).filter(Boolean);
 document.querySelectorAll(".si").forEach(e=>d.steps[+e.dataset.i].t=e.value);
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button,.card");if(!t)return;
 if(t.classList.contains("tile")){F.st=t.dataset.k;render();return}
 if(t.classList.contains("card")){detail(t.dataset.id);return}
 if(t.id=="fab"){form();return}
 if(t.id=="th"){setTheme(document.documentElement.dataset.theme=="dark"?"light":"dark");return}
 if(t.id=="mn"){menu();return}
 const a=t.dataset.a;if(!a)return;
 const id=$("#sh").dataset.id,c=cases.find(x=>x.id==id),i=+t.dataset.i;
 if(a=="x")close();
 else if(a=="cyc"){const s=c.steps[i];s.s=(s.s+1)%3;log(c,`Step "${s.t}" → ${["Pending","In progress","Done"][s.s]}`);sync(c);save();render();detail(id)}
 else if(a=="wait"){c.waiting=!c.waiting;log(c,c.waiting?"Marked waiting":"Resumed");save();render();detail(id)}
 else if(a=="pin"){c.pin=!c.pin;save();render();detail(id)}
 else if(a=="edit")form(c);
 else if(a=="del"){if(confirm("Delete this case permanently?")){cases=cases.filter(x=>x.id!=id);save();render();close()}}
 else if(a=="cats")catsSheet();
 else if(a=="cadd")catEdit(-1);
 else if(a=="cedit")catEdit(i);
 else if(a=="csave"){const n=$("#c_n").value.trim();if(!n)return;const st=$("#c_s").value.split("\n").map(v=>v.trim()).filter(Boolean);
  if(CATD.some((x,k)=>x.name==n&&k!=i)){alert("That name already exists");return}
  if(i>=0){const old=CATD[i].name;if(old!=n)cases.forEach(c=>{if(c.cat==old)c.cat=n});save();CATD[i]={name:n,steps:st}}else CATD.push({name:n,steps:st});
  setCats(CATD);render();catsSheet()}
 else if(a=="cdel"){if(CATD.length<=1){alert("Keep at least one category");return}if(confirm("Delete this category? Existing cases keep their category name.")){CATD.splice(i,1);setCats(CATD);render();catsSheet()}}
 else if(draft){
  pull();
  if(a=="add"){const v=$("#ns").value.trim();if(v)draft.steps.push({t:v,s:0});drawForm()}
  else if(a=="rm"){draft.steps.splice(i,1);drawForm()}
  else if(a=="up"&&i>0){[draft.steps[i-1],draft.steps[i]]=[draft.steps[i],draft.steps[i-1]];drawForm()}
  else if(a=="dn"&&i<draft.steps.length-1){[draft.steps[i+1],draft.steps[i]]=[draft.steps[i],draft.steps[i+1]];drawForm()}
  else if(a=="save"){
   if(!draft.title){$("#f_t").focus();return}
   draft.steps=draft.steps.filter(s=>s.t.trim());
   if(draft.id){const k=cases.findIndex(x=>x.id==draft.id);log(draft,"Case edited");sync(draft);cases[k]=draft}
   else{draft.id=Date.now().toString(36);log(draft,"Case created");cases.push(draft)}
   save();render();const nid=draft.id;draft=null;detail(nid)}
 }
 else if(a=="exp"){const b=new Blob([JSON.stringify({cases,cats:CATD},null,1)],{type:"application/json"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download="hr-cases-"+today()+".json";l.click()}
 else if(a=="imp")$("#file").click();
 else if(a=="wipe"){if(confirm("Erase ALL cases?")){cases=[];save();render();close()}}
});
document.addEventListener("change",e=>{
 if(e.target.id=="f_c"&&draft&&!draft.id){pull();if(!draft.steps.length||draft.steps.every(s=>s.s==0&&Object.values(TPL).some(a=>a.includes(s.t))))draft.steps=(TPL[draft.cat]||[]).map(t=>({t,s:0}));drawForm()}
 if(e.target.id=="file"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const a=Array.isArray(o)?o:o.cases;if(!Array.isArray(a))throw 0;if(o.cats){const nm=new Set(CATD.map(x=>x.name));o.cats.forEach(x=>{if(!nm.has(x.name))CATD.push(x)});setCats(CATD)}const ids=new Set(cases.map(c=>c.id));a.forEach(c=>{if(!ids.has(c.id))cases.push(c)});save();render();close();alert("Imported "+a.length+" cases")}catch(x){alert("Invalid backup file")}};r.readAsText(f)}
});
function catsSheet(){
 open(`<div class="t" style="font-size:18px">🗂 Categories</div><p class="sm">Each category can have default steps that fill in automatically for new cases.</p>
 ${CATD.map((x,i)=>`<div class="step"><span class="x">${esc(x.name)} <span class="sm">· ${x.steps.length} steps</span></span><button class="mini" data-a="cedit" data-i="${i}">✏️</button><button class="mini" data-a="cdel" data-i="${i}">🗑</button></div>`).join("")}
 <div class="row" style="margin-top:12px"><button class="btn" data-a="cadd">＋ New category</button><button class="btn g" data-a="x">Done</button></div>`)
}
function catEdit(i){
 const x=i<0?{name:"",steps:[]}:CATD[i];
 open(`<div class="t" style="font-size:18px">${i<0?"New category":"Edit category"}</div>
 <label>Name</label><input id="c_n" value="${esc(x.name)}" placeholder="e.g. Medical Leave">
 <label>Default steps (one per line, in order)</label><textarea id="c_s" style="min-height:150px">${esc(x.steps.join("\n"))}</textarea>
 <div class="row" style="margin-top:12px"><button class="btn" data-a="csave" data-i="${i}">Save</button><button class="btn g" data-a="cats">Back</button></div>`)
}
function menu(){
 const w=cases.filter(c=>c.closedAt),wk=w.filter(c=>days(c.closedAt,now())<7).length,mo=w.filter(c=>days(c.closedAt,now())<30).length;
 const avg=w.length?(w.reduce((s,c)=>s+Math.max(0,days(c.opened,c.closedAt)),0)/w.length).toFixed(1):"–";
 open(`<div class="t" style="font-size:18px">📊 Stats & backup</div>
 <div class="card">Closed this week: <b>${wk}</b><br>Closed this month: <b>${mo}</b><br>Avg days to close: <b>${avg}</b></div>
 <div class="row"><button class="btn g" data-a="cats">🗂 Manage categories</button></div>
 <div class="row"><button class="btn" data-a="exp">📤 Export JSON</button><button class="btn g" data-a="imp">📥 Import</button></div>
 <input type="file" id="file" accept="application/json" hidden>
 <p class="sm">Data lives only in this browser on this phone. Export a backup regularly.</p>
 <div class="row"><button class="btn r" data-a="wipe">Erase all</button><button class="btn g" data-a="x">Done</button></div>`);
}
$("#ov").addEventListener("click",e=>{if(e.target.id=="ov")close()});
["q","fc","fp","so"].forEach(k=>$("#"+k).addEventListener("input",render));
load();loadC();if(theme)document.documentElement.dataset.theme=theme;fill();render();
</script></body></html>
